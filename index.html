<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UKRAINIAN AXES — Особистий кабінет</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      color: #f8d24b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .logo {
      margin-top: 20px;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 0 10px #f8d24b;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
      margin-top: 25px;
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 2px solid #f8d24b;
      margin: 10px auto;
      background: url('https://upload.wikimedia.org/wikipedia/commons/4/49/Axe_icon.png') center/contain no-repeat;
    }

    .nickname {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      margin-top: 10px;
    }

    .rank {
      font-size: 16px;
      color: #f8d24b;
      margin-top: 5px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat span:first-child {
      font-size: 18px;
      color: #fff;
    }

    .stat span:last-child {
      font-size: 12px;
      color: #f8d24b;
      opacity: 0.8;
    }

    .btn {
      background: linear-gradient(90deg, #f8d24b, #c6a300);
      color: #000;
      font-weight: bold;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: linear-gradient(90deg, #ffd84f, #e6b800);
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="logo">🪓 UKRAINIAN AXES 🪓<br><small>Особистий кабінет учасника</small></div>

  <div class="card">
    <div class="avatar"></div>
    <div class="nickname">@YourNick</div>
    <div class="rank">Ранг: Захисник</div>

    <div class="stats">
      <div class="stat">
        <span>120</span>
        <span>Балів</span>
      </div>
      <div class="stat">
        <span>5</span>
        <span>Завдань</span>
      </div>
      <div class="stat">
        <span>3</span>
        <span>Рівень</span>
      </div>
    </div>

    <button class="btn">Отримати бонус 🎁</button>
  </div>

  <footer>© 2025 UKRAINIAN AXES | Mini App by UA</footer>
</body>
</html>
